<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Online Grocery Store</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
        }

        header {
            background-color: green;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .products {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .product {
            background-color: white;
            width: 200px;
            padding: 15px;
            text-align: center;
            border-radius: 10px;
        }

        .product img {
            width: 150px;
            height: 120px;
            object-fit: cover;
        }

        input {
            width: 60px;
            padding: 7px;
            margin: 10px;
        }

        button {
            background-color: green;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
        }

        .cart {
            margin-top: 40px;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid #ddd;
            padding: 15px;
        }

        .cart-item img {
            width: 80px;
            height: 70px;
            object-fit: cover;
        }

        .total {
            text-align: right;
            font-size: 22px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>🛒 My Grocery Store</h1>
        <p>Fresh groceries at your doorstep</p>
    </header>


    <div class="container">

        <h2>Products</h2>

        <div class="products">

            <!-- APPLE -->
            <div class="product">

                <img
                    src="https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=400"
                    alt="Apple"
                >

                <h3>Apple</h3>

                <p>₹120 per kg</p>

                <input
                    type="number"
                    id="appleQty"
                    value="1"
                    min="1"
                >

                <br>

                <button onclick="addToCart('apple')">
                    Add to Cart
                </button>

            </div>


            <!-- BANANA -->
            <div class="product">

                <img
                    src="https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?w=400"
                    alt="Banana"
                >

                <h3>Banana</h3>

                <p>₹60 per kg</p>

                <input
                    type="number"
                    id="bananaQty"
                    value="1"
                    min="1"
                >

                <br>

                <button onclick="addToCart('banana')">
                    Add to Cart
                </button>

            </div>


            <!-- TOMATO -->
            <div class="product">

                <img
                    src="https://images.unsplash.com/photo-1546094096-0df4bcaaa337?w=400"
                    alt="Tomato"
                >

                <h3>Tomato</h3>

                <p>₹40 per kg</p>

                <input
                    type="number"
                    id="tomatoQty"
                    value="1"
                    min="1"
                >

                <br>

                <button onclick="addToCart('tomato')">
                    Add to Cart
                </button>

            </div>


            <!-- ORANGE -->
            <div class="product">

                <img
                    src="https://images.unsplash.com/photo-1547514701-42782101795e?w=400"
                    alt="Orange"
                >

                <h3>Orange</h3>

                <p>₹100 per kg</p>

                <input
                    type="number"
                    id="orangeQty"
                    value="1"
                    min="1"
                >

                <br>

                <button onclick="addToCart('orange')">
                    Add to Cart
                </button>

            </div>

        </div>


        <!-- CART -->

        <div class="cart">

            <h2>🛒 Your Cart</h2>

            <div id="cartItems">
                <p>Your cart is empty.</p>
            </div>

            <div class="total">
                Total: ₹<span id="total">0</span>
            </div>

        </div>

    </div>


    <script>

        const products = {

            apple: {
                name: "Apple",
                price: 120,
                image: "https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=400"
            },

            Tea: {
                name: "Tea",
                price: 60,
                image: "https://cdn.britannica.com/12/180112-138-DBC1C64A/tea-cultivation-brewing.jpg?w=800&h=450&c=crop"
            },

            tomato: {
                name: "Tomato",
                price: 40,
                image: "https://images.unsplash.com/photo-1546094096-0df4bcaaa337?w=400"
            },

            orange: {
                name: "Orange",
                price: 100,
                image: "https://images.unsplash.com/photo-1547514701-42782101795e?w=400"
            }

        };

        let cart = [];


        function addToCart(productName) {

            let product = products[productName];

            let quantity = Number(
                document.getElementById(productName + "Qty").value
            );

            let existingProduct = cart.find(
                item => item.name === product.name
            );


            if (existingProduct) {

                // Increase quantity
                existingProduct.quantity += quantity;

            } else {

                // Add new product
                cart.push({
                    name: product.name,
                    price: product.price,
                    quantity: quantity,
                    image: product.image
                });

            }


            // Display cart
            displayCart();
        }


        function displayCart() {

            let cartItems =
                document.getElementById("cartItems");

            let totalElement =
                document.getElementById("total");


            // Clear old cart
            cartItems.innerHTML = "";


            let total = 0;

            if (cart.length === 0) {

                cartItems.innerHTML =
                    "<p>Your cart is empty.</p>";

                totalElement.innerText = 0;

                return;
            }

            for (let item of cart) {

                let amount =
                    item.price * item.quantity;


                total += amount;

            
                cartItems.innerHTML += `

                    <div class="cart-item">

                        <img
                            src="${item.image}"
                            alt="${item.name}"
                        >

                        <div>

                            <h3>${item.name}</h3>

                            <p>
                                Price: ₹${item.price} / kg
                            </p>

                            <p>
                                Quantity: ${item.quantity} kg
                            </p>

                            <p>
                                Amount: ₹${amount}
                            </p>

                        </div>

                    </div>

                `;
            }

            totalElement.innerText = total;
        }

    </script>

</body>
</html>
