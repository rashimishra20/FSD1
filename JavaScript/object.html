<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object</title>
</head>
<body>
    <p id="demo"></p>
    <script>
    const student = {
        name: "rashi",
        class: "ds-b",
        fee: "100000"
    };

    for (let key in student) {
        document.getElementById("demo").innerHTML +=  key + " : " + student[key] + "<br>";
    }
</script>
</body>
</html>
