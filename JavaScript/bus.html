<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Booking System</title>
</head>

<body>

    <div style="background-color: beige; border: 2px solid red; height: 1000px; width: 600px;">

        <center>
            <h1>Welcome to Bus Booker</h1>
        </center>

        <h3>User Information</h3>

        <p>NAME:</p>
        <input type="text" id="name">

        <p>
            ADDRESS (select your city):
            <select id="city">
                <option value="Gzb">Gzb</option>
                <option value="Delhi">Delhi</option>
                <option value="Kanpur">Kanpur</option>
                <option value="Meerut">Meerut</option>
                <option value="Hapur">Hapur</option>
            </select>
        </p>

        <p>
            User Age:
            <input type="text" id="age">
        </p>

        <p> User Aadhar Number:
            <input type="text" id="aadhar">
        </p> <br>

        <h3>Bus Booking Options</h3>

        <p>
            Select Bus Options:
            <br><br>

            AC Bus: 2000
            <input type="radio" name="bus" value="2000">

            NON AC Bus: 1000
            <input type="radio" name="bus" value="1000">
        </p>

        <p>
            Select your seat:
            <select id="seat">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
            </select>
        </p>

        <button id="bookBtn">Book</button>

        <div id="result"></div>

    </div>


    <script>

        document.getElementById("bookBtn").addEventListener("click", function () {

        
            let name = document.getElementById("name").value;
            let city = document.getElementById("city").value;
            let age = document.getElementById("age").value;
            let aadhar = document.getElementById("aadhar").value;
            let bus = document.querySelector('input[name="bus"]:checked');
            let seat = document.getElementById("seat").value;

            if (bus == null) {
                alert("Please select a bus!");
                return;
            }

            
            let price = Number(bus.value);

            
            document.getElementById("result").innerHTML = `
                <h3>Booking Details</h3>
                <p><b>Name:</b> ${name}</p>
                <p><b>City:</b> ${city}</p>
                <p><b>Age:</b> ${age}</p>
                <p><b>Aadhar:</b> ${aadhar}</p>
                <p><b>Bus Price:</b> ₹${price}</p>
                <p><b>Seat Number:</b> ${seat}</p>
                <h3>Total Price: ₹${price*seat}</h3>
            `;

        });

    </script>

</body>
</html>
