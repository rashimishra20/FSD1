<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loop</title>
</head>
<body>
    <p id ="demo"></p>
    <script>
       var fruits = ["Apple", "Banana", "Mango"];
       let len=fruits.length;
       let text=" ";
       for(let i=0;i<len;i++){
        if(i==1) continue;
        text+=fruits[i]+"<br>";
       }
       document.getElementById("demo").innerHTML=text;
    </script>
</body>
</html>
